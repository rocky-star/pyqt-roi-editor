[project]
name = "pyqt-roi-editor"
version = "0.1"
description = "A simple ROI (region of interest) editor written in PySide6"
readme = "README.rst"
authors = [
  { name = "Rocky☆Star", email = "rocky-star22@outlook.com" }
]
license = "GPL-3.0-or-later"
keywords = [ "region of interest", "ROI" ]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Image Processing",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
requires-python = ">= 3.12"
dependencies = [
  "pyside6 >= 6.11.2",
]

[project.urls]
Homepage = "https://github.com/rocky-star/pyqt-roi-editor"
Issues = "https://github.com/rocky-star/pyqt-roi-editor/issues"

[project.scripts]
pyqt-roi-editor = "pyqt_roi_editor.main:main"

[tool.pyrefly.errors]
missing-source = "ignore"
missing-source-for-stubs = "ignore"
bad-override-mutable-attribute = "error"

[build-system]
requires = [ "hatchling", "pyside6-essentials >= 6.11.2" ]
build-backend = "hatchling.build"

# `hatch_build.py` runs `pyside6-project build` before each build, which
# compiles the forms, resources and translations listed below. The
# results are ignored by the VCS, so they have to be named as artifacts
# to reach the distributions.
[tool.hatch.build]
artifacts = [
  "src/pyqt_roi_editor/ui_*.py",
  "src/pyqt_roi_editor/rc_*.py",
  "src/pyqt_roi_editor/translations/*.qm",
]

[tool.hatch.build.hooks.custom]

[tool.hatch.build.targets.wheel]
packages = [ "src/pyqt_roi_editor" ]

[tool.pyside6-project]
files = [
  # Python modules
  "src/pyqt_roi_editor/__init__.py",
  "src/pyqt_roi_editor/main.py",
  "src/pyqt_roi_editor/document.py",
  "src/pyqt_roi_editor/storage.py",
  "src/pyqt_roi_editor/helpers.py",
  "src/pyqt_roi_editor/roi_graphics_view.py",
  "src/pyqt_roi_editor/coords_input.py",
  "src/pyqt_roi_editor/zoom_box.py",
  "src/pyqt_roi_editor/shape_props_editor.py",
  "src/pyqt_roi_editor/dump_shape_dialog.py",
  # UI files
  "src/pyqt_roi_editor/mainwindow.ui",
  "src/pyqt_roi_editor/shapepropseditor.ui",
  "src/pyqt_roi_editor/dumpshapedialog.ui",
  "src/pyqt_roi_editor/coordsinput.ui",
  # Resources (images & translations)
  "src/pyqt_roi_editor/roieditor.qrc",
  "src/pyqt_roi_editor/translations/roieditor_zh_CN.ts",
]

[tool.pytest.ini_options]
testpaths = [ "tests" ]

[tool.pyright]
include = [ "src" ]
enableTypeIgnoreComments = true
ignore = [ "**/ui_*.py" ]
reportMissingModuleSource = "none"
reportUnusedCallResult = "none"
reportIgnoreCommentWithoutRule = "none"
reportIncompatibleUnannotatedOverride = "error"
reportUnannotatedClassAttribute = "none"

[tool.pyrefly]
project-includes = [ "src" ]
search-path = [ "typings" ]
infer-with-first-use = false

[tool.ruff.lint.isort]
section-order = [
  "future",
  "standard-library",
  "third-party",
  "first-party",
  "local-folder",
  "pyside-feature",
]

[tool.ruff.lint.isort.sections]
pyside-feature = [ "__feature__" ]

[tool.ruff.lint.pyflakes]
# `rc_roieditor` is imported to register the resources it holds, and
# `__feature__` to change the syntax of the module that imports it.
allowed-unused-imports = [ "__feature__", "pyqt_roi_editor.rc_roieditor" ]

[dependency-groups]
dev = [
  "pytest>=9.1.1",
]
